name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-snapshot:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: npm ci && npm run build
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          install-only: true
      - run: goreleaser release --snapshot --clean
      - run: python3 scripts/verify_release.py dist
      - name: Check release images
        run: bash scripts/smoke_release_images.sh

  goreleaser:
    if: github.event_name == 'push'
    needs: [ci, release-snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: '[[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - run: npm ci && npm run build
      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published assets and architectures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name' | sort > release-assets.txt
          test "$(grep -c '^linkding_.*\.tar\.gz$' release-assets.txt)" -eq 4
          test "$(grep -c '^linkding_.*\.zip$' release-assets.txt)" -eq 2
          grep -qx SHA256SUMS release-assets.txt
          release_dir=$(mktemp -d /tmp/linkding-release.XXXXXX)
          gh release download "$RELEASE_VERSION" --dir "$release_dir"
          (cd "$release_dir" && sha256sum --check SHA256SUMS)
          for image in ghcr.io/${{ github.repository }} ghcr.io/${{ github.repository }}-plus; do
            docker buildx imagetools inspect "$image:$RELEASE_VERSION" > manifest.txt
            grep -q 'linux/amd64' manifest.txt
            grep -q 'linux/arm64' manifest.txt
          done
