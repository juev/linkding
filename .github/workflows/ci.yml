name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkding_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LINKDING_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/linkding_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=docker
      - run: python3 scripts/verify_release.py dist
      - run: CGO_ENABLED=0 go test -p 1 ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...

  images:
    needs: go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linkding, linkding-plus]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }}
        run: docker buildx build --target '${{ matrix.target }}' -t linkding-smoke:local --load .
      - name: Start ${{ matrix.target }}
        run: |
          docker volume create linkding-smoke-data
          docker run -d --name linkding-smoke -p 9090:9090 \
            --read-only --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -v linkding-smoke-data:/etc/linkding/data \
            -e LD_CONTEXT_PATH=linkding/ \
            -e LD_SUPERUSER_NAME=admin \
            -e LD_SUPERUSER_PASSWORD=smoke-pass \
            linkding-smoke:local
      - name: Check HTTP and persistent data
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/linkding/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9090/linkding/health
          curl -fsS -o /dev/null http://127.0.0.1:9090/linkding/static/bundle.js
          docker exec linkding-smoke /usr/local/bin/linkding healthcheck
          docker cp linkding-smoke:/etc/linkding/data/db.sqlite3 /tmp/linkding-smoke-db.sqlite3
          docker cp linkding-smoke:/etc/linkding/data/secretkey.txt /tmp/linkding-smoke-secretkey.txt
          test -s /tmp/linkding-smoke-db.sqlite3
          test -s /tmp/linkding-smoke-secretkey.txt
          docker stop linkding-smoke
          docker start linkding-smoke
          docker cp linkding-smoke:/etc/linkding/data/db.sqlite3 /tmp/linkding-smoke-db-restarted.sqlite3
          docker cp linkding-smoke:/etc/linkding/data/secretkey.txt /tmp/linkding-smoke-secretkey-restarted.txt
          cmp /tmp/linkding-smoke-secretkey.txt /tmp/linkding-smoke-secretkey-restarted.txt
          test -s /tmp/linkding-smoke-db-restarted.sqlite3
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/linkding/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs linkding-smoke
          exit 1
      - name: Check HTML snapshot tool
        if: matrix.target == 'linkding-plus'
        run: |
          docker exec linkding-smoke node -e "require('http').get('http://127.0.0.1:9090/linkding/login/', r => { console.log('container HTTP status:', r.statusCode); process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', e => { console.error(e); process.exit(1) })"
          docker exec linkding-smoke sh -c 'timeout 45 chromium --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --dump-dom http://127.0.0.1:9090/linkding/login/ >/tmp/chromium-dom.html 2>/tmp/chromium-stderr.log || { tail -n 30 /tmp/chromium-stderr.log; exit 1; }; grep -q "<title>Login - Linkding" /tmp/chromium-dom.html'
          if docker exec linkding-smoke sh -c 'timeout 120 single-file \
            --browser-wait-until=load \
            --browser-load-max-time=60000 \
            --browser-wait-until-fallback=false \
            --debug-messages-file=/tmp/singlefile-debug.log \
            --browser-arg="--headless=new" \
            --browser-arg="--user-data-dir=./data/chromium-profile" \
            --browser-arg="--no-sandbox" \
            --browser-arg="--disable-dev-shm-usage" \
            --browser-arg="--disable-gpu" \
            http://127.0.0.1:9090/linkding/login/ /tmp/smoke.html'; then
            :
          else
            exit_code=$?
            docker exec linkding-smoke sh -c 'test ! -f /tmp/singlefile-debug.log || tail -n 80 /tmp/singlefile-debug.log'
            docker logs linkding-smoke --tail 50
            exit "$exit_code"
          fi
          docker exec linkding-smoke test -s /tmp/smoke.html
          docker exec linkding-smoke sh -c "grep -q '<title>Login - Linkding' /tmp/smoke.html"
