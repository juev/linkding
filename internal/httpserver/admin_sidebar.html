{{define "admin_sidebar"}}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="Toggle navigation"></button><nav class="sticky" id="nav-sidebar" aria-label="Sidebar"><input type="search" id="nav-filter" placeholder="Start typing to filter…" aria-label="Filter navigation items">{{range .DashboardApps}}<div class="app-{{.Slug}} module"><table><caption><a href="{{.Path}}" class="section" title="Models in the {{.Label}} application">{{.Label}}</a></caption><thead class="visually-hidden"><tr><th scope="col">Model name</th><th scope="col">Add link</th><th scope="col">Change or view list link</th></tr></thead><tbody>{{range .Models}}<tr class="model-{{.Model}}"><th scope="row" id="nav-{{.App}}-{{.Model}}"><a href="{{.Path}}">{{.Label}}</a></th><td>{{if .AddPath}}<a href="{{.AddPath}}" class="addlink" aria-describedby="nav-{{.App}}-{{.Model}}">Add</a>{{end}}</td></tr>{{end}}</tbody></table></div>{{end}}<div class="app-huey_app module"><table><caption><a href="" class="section" title="Models in the Huey application">Huey</a></caption><thead class="visually-hidden"><tr><th scope="col">Model name</th><th scope="col">Add link</th><th scope="col">Change or view list link</th></tr></thead><tbody><tr class="model-background_tasks"><th scope="row" id="nav-huey_app-background_tasks"><a href="{{.Prefix}}admin/tasks/">Queued tasks</a></th><td></td></tr></tbody></table></div></nav>
{{end}}
