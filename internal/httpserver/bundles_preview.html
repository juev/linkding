<turbo-frame id="preview">{{if eq .Count 0}}<div>No bookmarks match the current bundle.</div>{{else}}<div class="mb-4">Found {{.Count}} bookmarks matching this bundle.</div><section aria-label="Bookmark list"><ul class="bookmark-list" role="list">{{range .Items}}<li role="listitem"><div class="content"><div class="title"><a href="{{.URL}}" target="_blank" rel="noopener"><span>{{.Title}}</span></a></div>{{if .Description}}<div class="description inline truncate">{{.Description}}</div>{{end}}{{if .Tags}}<div class="tags">{{range .Tags}}<span>{{.}}</span> {{end}}</div>{{end}}</div></li>{{end}}</ul></section>{{end}}</turbo-frame>
