<!DOCTYPE html>
<html lang="en-us">
<head>
  <title>{{.Title}} | linkding Admin</title>
  <link rel="stylesheet" href="{{.Prefix}}static/admin/css/base.css">
  <link rel="stylesheet" href="{{.Prefix}}static/admin/css/dark_mode.css">
  <script src="{{.Prefix}}static/admin/js/theme.js"></script>
  <link rel="stylesheet" href="{{.Prefix}}static/admin/css/forms.css">
  <link rel="stylesheet" href="{{.Prefix}}static/admin/css/responsive.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="NONE,NOARCHIVE">
</head>
<body class="app-auth model-user change-form">
<a href="#content-start" class="skip-to-content-link">Skip to main content</a>
<div id="container">
  <header id="header"><div id="branding"><div id="site-name"><a href="{{.Prefix}}admin/">linkding administration</a></div></div><div id="user-tools">Welcome, <strong>{{.Username}}</strong>. <a href="{{.Prefix}}">View site</a></div></header>
  <nav aria-label="Breadcrumbs"><div class="breadcrumbs"><a href="{{.Prefix}}admin/">Home</a> &rsaquo; <a href="{{.Prefix}}admin/auth/user/">Users</a> &rsaquo; <a href="{{.ChangeURL}}">{{.Target}}</a> &rsaquo; Change password</div></nav>
  <div class="main" id="main"><main id="content-start" class="content"><div id="content" class="colM">
    <h1>{{.Title}}</h1>
    {{if .Error}}<p class="errornote">{{.Error}}</p>{{end}}
    <form method="post" action="{{.Action}}" id="user_form" novalidate>
      <input type="hidden" name="csrfmiddlewaretoken" value="{{.CSRFToken}}">
      <fieldset class="module aligned">
        <div class="form-row"><label>Password-based authentication:</label><label><input type="radio" name="usable_password" value="true"{{if .UsablePassword}} checked{{end}}> Enabled</label> <label><input type="radio" name="usable_password" value="false"{{if not .UsablePassword}} checked{{end}}> Disabled</label></div>
        <div class="form-row"><label for="id_password1">Password:</label><input type="password" name="password1" id="id_password1" autocomplete="new-password"></div>
        <div class="form-row"><label for="id_password2">Password confirmation:</label><input type="password" name="password2" id="id_password2" autocomplete="new-password"></div>
      </fieldset>
      <div class="submit-row"><input type="submit" value="Change password" class="default"></div>
    </form>
    <br class="clear">
  </div></main></div><footer id="footer"></footer>
</div>
</body>
</html>
